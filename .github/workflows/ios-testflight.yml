name: TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.0.0)"
        default: "1.0.0"
        required: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for var in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing repository secret: $var"
              missing=1
            fi
          done
          exit $missing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p private
          printf '%s\n' "$ASC_KEY_P8" > private/AuthKey.p8

      - name: Archive (automatic cloud signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          # xcodebuild echoes its own argv, so the anon key would land in the
          # log verbatim. Redact it before anything is written to disk —
          # GitHub only masks the console stream, not files we upload.
          redact () { sed -e "s|$SUPABASE_ANON_KEY|<redacted>|g"; }
          xcodebuild archive \
            -project Handl.xcodeproj \
            -scheme Handl \
            -destination 'generic/platform=iOS' \
            -archivePath build/Handl.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=RS6J29JLPS \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            2>&1 | redact | tee archive.log | tail -n 120

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Handl.xcarchive \
            -exportOptionsPlist ci/exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -n 80
          echo "Build ${{ github.run_number }}.${{ github.run_attempt }} uploaded — it will appear in TestFlight after Apple processes it (5-15 min)."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
