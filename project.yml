name: Handl
options:
  bundleIdPrefix: com.facufuensa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.1"
targets:
  Handl:
    type: application
    platform: iOS
    sources:
      - path: Handl
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Handl/Info.plist
      properties:
        CFBundleDisplayName: Handl
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        # Kept from the app's original name. Changing it would orphan the App
        # Store Connect record and every TestFlight build under it; it is
        # never shown to users.
        PRODUCT_BUNDLE_IDENTIFIER: com.facufuensa.casita
        PRODUCT_NAME: Handl
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: RS6J29JLPS
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
schemes:
  Handl:
    build:
      targets:
        Handl: all
    run:
      config: Debug
    archive:
      config: Release
